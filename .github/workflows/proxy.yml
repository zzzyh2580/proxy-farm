name: proxy-farm
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sh${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- crawler.py 2>/dev/null || true
      - name: crawl
        run: python3 crawler.py ${{ matrix.shard }} 8 || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add results_*.jsonl details_*.jsonl progress_*.txt latest.txt
          git diff --cached --quiet || git commit -m "c${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sh${{ matrix.shard }} || true
  sqli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sql${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- sqli.py 2>/dev/null || true
      - name: run
        run: python3 sqli.py ${{ matrix.shard }} || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add sqli_*.jsonl sqli_*.txt
          git diff --cached --quiet || git commit -m "s${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
  jwt:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sql${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- sqli2.py 2>/dev/null || true
      - name: run
        run: python3 sqli2.py ${{ matrix.shard }} jwt || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add sqli2_*.jsonl sqli2_*.txt
          git diff --cached --quiet || git commit -m "j${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
  vip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sql${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- vip_inject.py 2>/dev/null || true
      - name: run
        run: python3 vip_inject.py ${{ matrix.shard }} || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add vip_*.jsonl vip_*.txt
          git diff --cached --quiet || git commit -m "v${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
  idor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sql${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- act_idor.py 2>/dev/null || true
      - name: run
        run: python3 act_idor.py ${{ matrix.shard }} idor || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add act_*.jsonl act_*.txt
          git diff --cached --quiet || git commit -m "i${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
  imgdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sh1
      - name: download images
        run: python3 imgdl.py || true
      - uses: actions/upload-artifact@v4
        with:
          name: loiship-imgs
          path: imgs/
          retention-days: 90
          if-no-files-found: warn
