name: proxy-farm
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'attack.py'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: attack
        run: |
          pip install -q requests || true
          python3 attack.py
      - name: push
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add results.txt
          git diff --cached --quiet || git commit -m update
          git push origin main || true
