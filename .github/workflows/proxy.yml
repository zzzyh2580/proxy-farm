name: proxy-farm
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'
      - 'crawler.py'

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: crawl
        run: python3 crawler.py || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add results.jsonl details.jsonl progress.txt latest.txt
          git diff --cached --quiet || git commit -m update
          git push origin main || true
