        run: |
          git fetch origin main --quiet || true
          git checkout origin/main -- sv_probe.py 2>/dev/null || true
      - name: run
        run: python3 sv_probe.py ${{ matrix.shard }} || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "s${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
