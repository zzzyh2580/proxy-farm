name: proxy-farm
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sh${{ matrix.shard }}
          fetch-depth: 0
      - name: sync scripts
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- crawler.py 2>/dev/null || true
      - name: crawl
        run: python3 crawler.py ${{ matrix.shard }} 8 || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add results_*.jsonl details_*.jsonl progress_*.txt latest.txt
          git diff --cached --quiet || git commit -m "c ${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sh${{ matrix.shard }} || true
  sqli:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sql${{ matrix.shard }}
          fetch-depth: 0
      - name: sync scripts
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- sqli.py sqli2.py sqli3.py 2>/dev/null || true
      - name: sqli
        run: python3 sqli.py ${{ matrix.shard }} || true
      - name: sqli2
        run: |
          if [ ${{ matrix.shard }} -le 2 ]; then python3 sqli2.py ${{ matrix.shard }} jwt; else python3 sqli2.py ${{ matrix.shard }} idor; fi || true
      - name: sqli3
        run: python3 sqli3.py ${{ matrix.shard }} || true
      - name: vip
        run: python3 vip_inject.py ${{ matrix.shard }} || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add sqli_*.jsonl sqli_*.txt sqli2_*.jsonl sqli2_*.txt sqli3_*.jsonl sqli3_*.txt fulldetail.jsonl vip_*.jsonl vip_*.txt
          git diff --cached --quiet || git commit -m "s ${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
  imgdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sh1
      - name: download images
        run: python3 imgdl.py || true
      - uses: actions/upload-artifact@v4
        with:
          name: loiship-imgs
          path: imgs/
          retention-days: 90
          if-no-files-found: warn
