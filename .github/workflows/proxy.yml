name: proxy-farm
on:
  schedule:
    - cron: '*/6 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: attack
        run: |
          python3 - <<'PYEOF'
          import requests, json, time, os
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          HDR = {"User-Agent": UA, "Origin": "https://loiship.com", "Referer": "https://loiship.com/"}
          out = []
          def log(s):
              print(s)
              out.append(str(s))
          try:
              r = requests.post("https://api.moegoat.com/api/user/login", headers=HDR, json={"email": "3124323585@qq.com", "password": "9876543210."}, timeout=15)
              log(f"login: {r.status_code} {r.text[:100]}")
              tok = ""
              if r.status_code == 200:
                  tok = (r.json().get("access_token") or "").replace("bearer ", "")
              H = dict(HDR, Authorization="Bearer " + tok)
              time.sleep(1)
              for ep in ["download_v6", "download_v5", "online_play_v2", "online_play_v1"]:
                  try:
                      r = requests.get(f"https://api.moegoat.com/api/user/loi/{ep}/6422", headers=H, timeout=15)
                      log(f"{ep}/6422: {r.status_code} {r.text[:200]}")
                  except Exception as e:
                      log(f"{ep}: EXC {type(e).__name__}")
                  time.sleep(0.8)
              for pg in [1, 2, 3]:
                  try:
                      r = requests.get(f"https://api.moegoat.com/api/lois?page={pg}", headers=H, timeout=15)
                      log(f"lois p{pg}: {r.status_code} {r.text[:120]}")
                  except Exception as e:
                      log(f"lois p{pg}: EXC")
                  time.sleep(0.8)
          except Exception as e:
              log(f"FATAL {type(e).__name__} {str(e)[:100]}")
          open("results.txt", "w").write("\n".join(out))
          PYEOF
      - name: push
        env:
          GH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add results.txt
          git commit -m update || true
          git push origin main || true
