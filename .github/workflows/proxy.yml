name: proxy-farm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sh${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- crawler.py 2>/dev/null || true
      - name: crawl
        run: python3 crawler.py ${{ matrix.shard }} 4 || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add results_*.jsonl details_*.jsonl progress_*.txt latest.txt
          git diff --cached --quiet || git commit -m "c${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sh${{ matrix.shard }} || true
  comments:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sql${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- comments.py 2>/dev/null || true
      - name: run
        run: python3 comments.py ${{ matrix.shard }} || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add cmt_*.jsonl cmt_*.txt
          git diff --cached --quiet || git commit -m "c${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
  svprobe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sql${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- sv_probe.py 2>/dev/null || true
      - name: run
        run: python3 sv_probe.py ${{ matrix.shard }} || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add sv_*.jsonl sv_*.txt
          git diff --cached --quiet || git commit -m "s${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
  sprobe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shards/sql${{ matrix.shard }}
          fetch-depth: 0
      - name: sync
        run: |
          git fetch origin main --quiet
          git checkout origin/main -- sp_probe.py jwt_collect.py 2>/dev/null || true
      - name: run
        run: |
          python3 jwt_collect.py ${{ matrix.shard }} || true
          python3 sp_probe.py ${{ matrix.shard }} || true
          python3 login_brute.py ${{ matrix.shard }} || true
      - name: push
        run: |
          git config user.name proxy
          git config user.email proxy@users.noreply.github.com
          git add sp_*.jsonl sp_*.txt jwt_*.txt jwt_sample.txt lb_*.txt BRUTED.txt
          git diff --cached --quiet || git commit -m "p${{ matrix.shard }}"
          git push --force origin HEAD:refs/heads/shards/sql${{ matrix.shard }} || true
